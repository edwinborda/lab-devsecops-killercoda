server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # El frontend llama /api/* y Nginx lo reenvía al Service "backend" de Kubernetes
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
  }

  location /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
